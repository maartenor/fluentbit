apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.4.2
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
            - name: grpc
              containerPort: 9096
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: chunks
              mountPath: /loki/chunks
            - name: index
              mountPath: /loki/index
            - name: wal
              mountPath: /loki/wal
            - name: compactor
              mountPath: /loki/compactor
            - name: index-cache
              mountPath: /loki/index_cache
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: chunks
          persistentVolumeClaim:
            claimName: loki-chunks
        - name: index
          emptyDir: {}
        - name: wal
          emptyDir: {}
        - name: compactor
          emptyDir: {}
        - name: index-cache
          emptyDir: {}
